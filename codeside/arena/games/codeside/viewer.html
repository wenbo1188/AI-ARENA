<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root { color-scheme: dark; --bg:#080d1a; --panel:#142039; --line:#2d3e5b; --fg:#e4e9f4; --muted:#8e9cbb; --p1:#ffad82; --p2:#93b8ff; --p1s:#f47c59; --p2s:#6898ff; --gold:#e4bc76; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg); font:13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; }
button,select { font:inherit; }
#app { height:100%; display:grid; grid-template-rows:42px 88px minmax(0,1fr) 72px; background:radial-gradient(ellipse at 50% 0,#182544 0,transparent 65%); }
#masthead { display:flex; align-items:center; justify-content:space-between; padding:0 26px; border-bottom:1px solid #ffffff08; font-size:10px; letter-spacing:.18em; color:var(--muted); }
.brand { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--fg); font-weight:800; letter-spacing:.16em; }
.brand-mark { color:var(--p2s); font-size:20px; letter-spacing:-3px; margin-right:6px; }
.brand small { font-size:9px; font-weight:500; border-left:1px solid var(--line); padding-left:13px; color:var(--muted); letter-spacing:.12em; }
.replay-status { display:flex; gap:8px; align-items:center; }
.replay-status:before { content:""; width:5px; height:5px; background:var(--p2s); border-radius:50%; box-shadow:0 0 10px #6898ff66; }
#top { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:30px; padding:10px 30px 16px; }
.team { min-width:0; display:flex; align-items:center; gap:14px; }
.team:before { content:"01"; display:grid; place-items:center; width:42px; height:44px; flex-shrink:0; font:700 16px Consolas,monospace; color:var(--p1); background:linear-gradient(135deg,#f47c5922,#f47c5906); border:1px solid #f47c5944; border-radius:2px; }
.team.r { justify-content:flex-end; text-align:right; }
.team.r:before { content:"02"; order:2; color:var(--p2); border-color:#6898ff44; background:linear-gradient(135deg,#6898ff22,#6898ff06); }
.team .nm { font-size:20px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.team .nm:before { content:"RED / 红队"; display:block; color:var(--p1); font-size:9px; letter-spacing:.16em; font-weight:600; margin-bottom:2px; }
.team.r .nm:before { content:"BLUE / 蓝队"; color:var(--p2); }
.crash { display:none; font-size:10px; color:var(--p1); border:1px solid #f47c5966; padding:1px 5px; }
#score { display:flex; align-items:center; gap:24px; font-variant-numeric:tabular-nums; }
#score .s { min-width:76px; font:600 34px/1 Consolas,monospace; letter-spacing:-.05em; }
#s1 { color:var(--p1); text-align:right; } #s2 { color:var(--p2); }
#score .mid { display:flex; align-items:center; flex-direction:column; gap:5px; color:var(--muted); font-size:9px; letter-spacing:.2em; }
#score .mid b { font-size:11px; font-weight:500; color:#c3d0e9; letter-spacing:.08em; }
#mid { display:grid; grid-template-columns:216px minmax(0,1fr) 216px; gap:14px; min-height:0; padding:0 18px 10px; }
.side { display:flex; flex-direction:column; gap:12px; min-width:0; overflow:auto; scrollbar-width:thin; }
.side:before { content:"01 / RED TEAM / 红队"; font:10px Consolas,monospace; color:var(--muted); letter-spacing:.15em; padding:5px 2px 2px; }
#side2:before { content:"02 / BLUE TEAM / 蓝队"; }
#stage { position:relative; min-width:0; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#0b1429; border:1px solid #3a5072; border-radius:5px; box-shadow:0 16px 50px #0005,inset 0 0 80px #040916; }
#cv { display:block; }
.stage-label { position:absolute; top:14px; left:16px; display:flex; flex-direction:column; gap:3px; pointer-events:none; font:9px Consolas,monospace; letter-spacing:.14em; color:#9eb3d0; }
.stage-label b { font-size:11px; font-weight:500; color:#d7e8ff; }
.stage-label b:before { content:""; display:inline-block; width:5px; height:5px; margin-right:7px; background:var(--p2s); }
.stage-foot { position:absolute; bottom:12px; left:16px; right:16px; display:flex; justify-content:space-between; color:#90a7cd; font:9px Consolas,monospace; letter-spacing:.12em; pointer-events:none; }
.card { position:relative; padding:14px; border:1px solid #2f405c; background:linear-gradient(145deg,#17233bee,#101b30); border-radius:5px; overflow:hidden; }
.card.p1 { border-top:2px solid #f47c5999; } .card.p2 { border-top:2px solid #6898ff99; }
.card:after { content:""; position:absolute; top:0; right:0; width:65px; height:65px; background:linear-gradient(135deg,transparent,#ffffff03); pointer-events:none; }
.card.dead { opacity:.45; filter:grayscale(.9); }
.card.dead:after { content:"ELIMINATED"; top:14px; right:9px; width:auto; height:auto; font:8px Consolas,monospace; color:var(--muted); }
.card .hd { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.card .face { width:38px; height:34px; background:#0a1428; border:1px solid #394e6c; border-radius:3px; image-rendering:pixelated; }
.card .hd>div { min-width:0; }
.card .who { font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card .uid { font:9px Consolas,"Microsoft YaHei",monospace; color:var(--muted); margin-top:3px; letter-spacing:.08em; }
.hp { height:5px; position:relative; background:#273754; margin:0 0 8px; overflow:hidden; }
.hp i,.hp em { position:absolute; inset:0 auto 0 0; transition:width .12s; background:var(--p1s); }
.p2 .hp i { background:var(--p2s); }
.hp em { background:#f0ecd5; transition:width .6s .15s; }
.hp i.mid { background:#e4bc76; } .hp i.low { background:#f65764; }
.row { display:flex; align-items:center; justify-content:space-between; gap:7px; min-height:27px; font-size:11px; color:var(--muted); }
.row b { color:#dce3f4; font-weight:600; font-variant-numeric:tabular-nums; }
.wpn { display:flex; align-items:center; gap:6px; white-space:nowrap; } .wpn canvas,.wpn img { height:17px; image-rendering:pixelated; }
.ammo { display:flex; gap:2px; flex-wrap:wrap; justify-content:flex-end; max-width:64px; }
.ammo i { width:3px; height:8px; background:var(--gold); } .ammo i.e { background:#34435f; }
.tag { font-size:10px; color:var(--gold); border:1px solid #e4bc7644; padding:0 4px; }
.card.stats { margin-top:auto; background:#101a2e; border-top:1px solid #2f405c; }
.card.stats:before { content:"COMBAT REPORT / 战斗记录"; display:block; font:8px/1.5 Consolas,"Microsoft YaHei",monospace; letter-spacing:.07em; color:#788cae; margin-bottom:10px; }
.card.stats .row { min-height:30px; border-top:1px solid #ffffff05; }
.card.stats .row b { font:16px Consolas,monospace; }
#feed { position:absolute; top:14px; right:14px; display:flex; flex-direction:column; gap:5px; align-items:flex-end; pointer-events:none; }
#feed div { padding:7px 10px; background:#101b30ed; border:1px solid #425673; border-left:2px solid var(--gold); border-radius:2px; font-size:11px; box-shadow:0 4px 12px #0004; }
#banner { position:absolute; inset:0; display:none; align-items:center; justify-content:center; pointer-events:none; background:linear-gradient(transparent,#07112666,transparent); }
#banner>div { padding:28px 54px; min-width:300px; max-width:90%; text-align:center; background:linear-gradient(135deg,#182744f5,#0b172bf5); border:1px solid #677ea5; border-top:2px solid var(--gold); box-shadow:0 20px 70px #0009; }
#banner>div:before { content:"MATCH COMPLETE / 对局结束"; display:block; font:10px Consolas,monospace; letter-spacing:.2em; color:var(--gold); margin-bottom:14px; }
#banner h2 { font-size:28px; font-weight:600; margin:0 0 9px; overflow-wrap:anywhere; }
#banner p { margin:0; color:var(--muted); font:13px Consolas,"Microsoft YaHei",monospace; }
#bar { display:flex; align-items:center; gap:12px; padding:12px 22px 18px; border-top:1px solid #ffffff06; background:#0c1629; }
button,select { height:34px; padding:0 11px; border:1px solid #324b70; border-radius:4px; background:#182744; color:#c8d7f1; cursor:pointer; white-space:nowrap; }
button:hover,select:hover { border-color:#93acd4; background:#243e65; } button.on { color:var(--p2); border-color:#6898ff55; }
button:focus-visible,select:focus-visible { outline:2px solid var(--p2); outline-offset:3px; }
#play { width:42px; background:var(--p2); color:#09162f; border-color:var(--p2); font-size:14px; }
#tl { position:relative; flex:1; min-width:35px; height:34px; cursor:pointer; touch-action:none; }
#tl .track,#tl .fill { position:absolute; left:0; top:15px; height:3px; border-radius:3px; }
#tl .track { right:0; background:#263c5c; } #tl .fill { background:linear-gradient(90deg,#385d9d,#9cc3ff); }
#tl .knob { position:absolute; top:11px; margin-left:-5px; width:11px; height:11px; border:2px solid #f0f5ff; background:#94b5f2; border-radius:50%; box-shadow:0 0 0 4px #6898ff14; }
#tl .mk { position:absolute; top:10px; width:2px; height:13px; margin-left:-1px; }
#tick { min-width:112px; text-align:right; color:var(--muted); font:10px Consolas,monospace; }
.hint { color:#8093b6; font-size:10px; }
@media(min-width:1800px) { #mid { grid-template-columns:246px minmax(0,1fr) 246px; gap:20px; padding:0 24px 14px; } .card { padding:18px; } }
@media(max-width:1250px) { #mid { grid-template-columns:174px minmax(0,1fr) 174px; gap:10px; padding:0 12px 10px; } .card { padding:11px; } .hint { display:none; } #score { gap:14px; } .ammo { max-width:40px; } .wpn { gap:3px; } .wpn b { font-size:10px; } }
@media(max-width:900px) and (orientation:portrait),(max-width:600px) {
 html,body { height:auto; min-height:100%; overflow:auto; } #app { display:flex; flex-direction:column; min-height:100vh; height:auto; }
 #masthead { height:38px; padding:0 14px; flex-shrink:0; } .brand small,.replay-status span { display:none; }
 #top { padding:12px; gap:8px; } .team { gap:0; } .team:before { display:none; } .team .nm { font-size:14px; } .team .nm:before { font-size:7px; letter-spacing:.05em; }
 #score { gap:9px; } #score .s { font-size:24px; min-width:30px; } #score .mid b { font-size:9px; } #score .mid span { font-size:7px; }
 #mid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); padding:0 8px 12px; gap:8px; }
 #stage { grid-column:1/-1; grid-row:1; width:100%; aspect-ratio:var(--ar,1.2); }
 .side { gap:8px; overflow:visible; } .side:before { font-size:8px; padding-top:7px; } .card { padding:10px; }
 .card .hd { gap:7px; margin-bottom:10px; } .card .face { width:30px; height:28px; } .card .who { font-size:11px; }
 .card.stats { margin-top:0; } .card.stats:before { font-size:7px; letter-spacing:0; } .row { min-height:24px; font-size:10px; } .ammo { max-width:45px; }
 .stage-label { top:9px; left:9px; font-size:7px; } .stage-label b { font-size:8px; } .stage-foot { bottom:7px; left:9px; right:9px; font-size:7px; }
 #feed { top:38px; right:7px; } #feed div { font-size:9px; padding:4px 6px; max-width:95%; }
 #banner>div { min-width:0; padding:20px; } #banner h2 { font-size:20px; } #banner>div:before { font-size:8px; }
 #bar { position:sticky; bottom:0; z-index:2; flex-wrap:wrap; padding:6px 12px calc(8px + env(safe-area-inset-bottom,0px)); gap:6px 8px; margin-top:auto; box-shadow:0 -8px 24px #07112566; }
 #tl { order:-2; flex:1 1 calc(100% - 125px); height:26px; } #tick { order:-1; font-size:9px; }
 #tl .track,#tl .fill { top:12px; } #tl .knob { top:8px; } #tl .mk { top:6px; } button,select { height:30px; font-size:11px; }
}
@media(orientation:landscape) and (max-height:650px) and (min-width:601px) {
 #app { grid-template-rows:28px 53px minmax(0,1fr) 44px; } #masthead { font-size:8px; } .brand { font-size:10px; } .brand small { font-size:8px; }
 #top { padding:4px 16px 8px; } .team .nm { font-size:14px; } .team:before { width:30px; height:30px; font-size:12px; } .team .nm:before { font-size:7px; }
 #score .s { font-size:24px; } #score .mid b { font-size:9px; } #score .mid span { display:none; }
 #mid { grid-template-columns:148px minmax(0,1fr) 148px; gap:8px; padding:0 8px 5px; } .side { gap:5px; } .side:before { display:none; }
 .card { padding:6px 8px; } .card .hd { margin-bottom:5px; gap:6px; } .card .face { width:24px; height:22px; } .card .who { font-size:10px; } .card .uid { font-size:8px; }
 .hp { height:3px; margin-bottom:4px; } .row { min-height:18px; font-size:9px; } .wpn canvas { height:12px; } .wpn b { font-size:9px; } .ammo i { height:6px; }
 .card.stats:before { display:none; } .card.stats .row { min-height:18px; } .card.stats .row b { font-size:11px; }
 #bar { padding:5px 12px; gap:8px; } button,select { height:28px; font-size:10px; } #tick { min-width:100px; font-size:9px; }
 .stage-label { top:8px; left:9px; } .stage-foot { bottom:5px; font-size:7px; } #feed { top:8px; right:8px; } #feed div { font-size:9px; padding:3px 6px; }
}
html.clean,html.clean body { height:100%; overflow:hidden; background:#080f22; }
html.clean #masthead,html.clean #top,html.clean #bar,html.clean .side,html.clean #feed,html.clean #banner,html.clean .stage-label,html.clean .stage-foot { display:none!important; }
html.clean #app,html.clean #mid { display:block; height:100%; padding:0; }
html.clean #stage { width:100%; height:100%; min-height:0; aspect-ratio:auto; border:0; border-radius:0; }
@media(prefers-reduced-motion:reduce) { .hp i,.hp em { transition:none; } }

#masthead { background:#101b30; border-bottom:1px solid #31507733; }
#stage { border-radius:2px; }
.card { border-radius:2px; box-shadow:inset 0 1px #ffffff04; }
.brand-mark { color:var(--p1s); }
.stage-label { padding:6px 8px; border-left:2px solid #e4bc76; background:#101b2fb3; }
.stage-label b:before { display:none; }
.stage-foot span { background:#101b2fb3; padding:3px 5px; }
#banner>div { border-radius:0; }

#stage { border-color:#3b506e; box-shadow:0 18px 50px #0007; }
#masthead { border-bottom-color:#314865; }
.brand { letter-spacing:.14em; } .brand-mark { color:#f47c59; }
.team .nm { font-family:Consolas,"Microsoft YaHei",monospace; }
.card .face { width:40px; height:40px; border-color:#415b80; }
.card.p1 { background:linear-gradient(125deg,#301e2d55,#102039 75%); }
.card.p2 { background:linear-gradient(125deg,#1a365e88,#102039 75%); }
.wpn canvas,.wpn img { max-width:40px; max-height:20px; height:auto; width:auto; object-fit:contain; }
.ammo i { width:4px; height:11px; background:linear-gradient(#bc7548 0 24%,#e6c276 24% 82%,#94733e 82%); clip-path:polygon(50% 0,85% 20%,85% 85%,100% 85%,100% 100%,0 100%,0 85%,15% 85%,15% 20%); }
.ammo i.e { background:#354460; }
#play { background:#a6c5ff; border-color:#a6c5ff; }
.stage-label { border-left-color:#ff7d82; background:#091327c9; }
.stage-foot span { background:#081329ba; }
@media(max-width:1250px){.wpn canvas{max-width:29px;}.ammo i{width:3px;}}
@media(orientation:landscape) and (max-height:650px) and (min-width:601px){.card .face{width:24px;height:24px;}.wpn canvas{max-width:24px;max-height:13px;}.ammo i{height:7px;}}
</style>
</head>
<body>
<div id="app">
  <div id="masthead"><div class="brand"><span class="brand-mark">//</span> CODESIDE <small>SHINJUKU / TOKYO 1987</small></div><div class="replay-status">ARCADE / REPLAY <span>/ 对局回放</span></div></div>
  <div id="top">
    <div class="team l"><span class="nm" id="n1"></span><span class="crash" id="c1">崩溃</span></div>
    <div id="score"><div class="s" id="s1">0</div><div class="mid"><b id="stagename"></b><span>COMBAT SCORE / 得分</span></div><div class="s" id="s2">0</div></div>
    <div class="team r"><span class="crash" id="c2">崩溃</span><span class="nm" id="n2"></span></div>
  </div>
  <div id="mid">
    <div class="side" id="side1"></div>
    <div id="stage"><canvas id="cv" aria-label="CodeSide 对局回放画面"></canvas><div class="stage-label"><b>新宿 / SHINJUKU</b><span>TOKYO NIGHT / 1987</span></div><div class="stage-foot"><span>CODESIDE / 战斗录像</span><span>OBS. 01 / 全图视角</span></div><div id="feed"></div><div id="banner"><div><h2 id="bt"></h2><p id="bs"></p></div></div></div>
    <div class="side" id="side2"></div>
  </div>
  <div id="bar">
    <button id="play" title="播放 / 暂停（空格）">▶</button>
    <select id="speed" title="播放速度">
      <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option>
      <option value="2">2×</option><option value="4">4×</option><option value="8">8×</option>
    </select>
    <div id="tl"><div class="track"></div><div class="fill"></div><div class="knob"></div></div>
    <span id="tick"></span>
    <button id="mode" title="切换画面（M）">街机画面</button>
    <button id="snd" title="音效">🔊 音效</button>
    <span class="hint">空格 播放 · ←/→ 逐帧 · M 切换画面</span>
  </div>
</div>
<script>
const R = @@DATA@@;
const ASSETS = @@ASSETS@@;
__SCRIPT__
</script>
</body>
</html>
